<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="../design.css">
</head>
<body>

<nav class="navbar">
    <div class="container row row-between">
        <span class="navbar-brand">{{BLOG_NAME}}</span>
        <div class="row">
            <a href="#" class="btn btn-ghost">الرئيسية</a>
            <a href="#" class="btn btn-ghost">المقالات</a>
            <a href="#" class="btn btn-ghost">من أنا</a>
        </div>
    </div>
</nav>

<header class="hero" style="min-height: 50vh;">
    <div class="container-sm">
        <h1 class="hero-title">{{BLOG_NAME}}</h1>
        <p class="hero-subtitle">{{BLOG_TAGLINE}}</p>
    </div>
</header>

<main class="container mt-8 mb-8">
    <div class="stack-lg">
        <article class="card">
            <div class="badge mb-4">{{DATE_1}}</div>
            <h3 class="mb-4">{{POST_1_TITLE}}</h3>
            <p class="text-muted mb-4">{{POST_1_SUMMARY}}</p>
            <a href="#" class="text-accent">اقرأ المزيد ←</a>
        </article>
        <article class="card">
            <div class="badge mb-4">{{DATE_2}}</div>
            <h3 class="mb-4">{{POST_2_TITLE}}</h3>
            <p class="text-muted mb-4">{{POST_2_SUMMARY}}</p>
            <a href="#" class="text-accent">اقرأ المزيد ←</a>
        </article>
        <article class="card">
            <div class="badge mb-4">{{DATE_3}}</div>
            <h3 class="mb-4">{{POST_3_TITLE}}</h3>
            <p class="text-muted mb-4">{{POST_3_SUMMARY}}</p>
            <a href="#" class="text-accent">اقرأ المزيد ←</a>
        </article>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 {{BLOG_NAME}}</p>
    </div>
</footer>

</body>
</html>
