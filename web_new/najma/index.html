<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="purple">
<head>
<meta charset="utf-8">
<title>نجم - الصفحة الرئيسية</title>
<link rel="stylesheet" href="../design.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .navbar { padding: 1rem 0; background-color: #2c3e50; }
  .navbar-brand { color: #ecf0f1; font-size: 1.5rem; }
  .hero { background-color: #f8f9fa; padding: 4rem 0; }
  .hero-title { color: #2c3e50; }
  .hero-subtitle { color: #7f8c8d; }
  .btn-primary { background-color: #8e44ad; color: #fff; padding: 0.75rem 1.5rem; border-radius: 0.3rem; transition: background-color 0.3s, transform 0.3s; }
  .btn-primary:hover { background-color: #732d91; transform: translateY(-2px); }
  .card { background-color: #ffffff; border-radius: 0.5rem; padding: 1.5rem; text-align: center; transition: transform 0.3s; }
  .card:hover { transform: translateY(-5px); }
  .card img { width: 64px; height: 64px; margin-bottom: 1rem; }
  .footer { background-color: #2c3e50; color: #bdc3c7; padding: 2rem 0; }
  .footer a { color: #ecf0f1; transition: color 0.3s; }
  .footer a:hover { color: #8e44ad; }
</style>
</head>
<body>
<nav class="navbar">
<div class="navbar-brand">نجم</div>
</nav>
<section class="hero">
<div class="container">
<h1 class="hero-title">مرحباً بك في نجم</h1>
<p class="hero-subtitle">نحن نوفر حلولاً مبتكرة لتلبية احتياجاتك.</p>
<a href="#services" class="btn btn-primary">اعرف أكثر</a>
</div>
</section>
<section id="services" class="container mt-8">
<h2 class="text-center">خدماتنا</h2>
<div class="grid grid-3">
<div class="card card-glass">
<img src="design.svg" alt="تصميم">
<h3 class="text-center">تصميم</h3>
<p class="text-muted">تصميم مواقع وتطبيقات.</p>
</div>
<div class="card card-glass">
<img src="development.svg" alt="تطوير">
<h3 class="text-center">تطوير</h3>
<p class="text-muted">برمجة عالية الجودة.</p>
</div>
<div class="card card-glass">
<img src="analysis.svg" alt="تحليل">
<h3 class="text-center">تحليل</h3>
<p class="text-muted">تحليل البيانات والاستشارات.</p>
</div>
</div>
</section>
<footer class="footer mt-8">
<div class="container text-center">
<p class="text-muted">© 2024 نجم. جميع الحقوق محفوظة.</p>
</div>
</footer>
</body>
</html>
