<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MOROAI — Luxury AI Studio Interface</title>

  <!-- Google Fonts: Tajawal (Display), IBM Plex Sans Arabic (Body), JetBrains Mono (Data/Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="./vendor/tailwind.js"></script>

  <!-- Three.js CDN for Interactive 3D Viewport -->
  <script src="./vendor/three.min.js"></script>

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM - "The Luxury Purple" (نظام التصميم الفاخر)
       ========================================================================== */
    :root {
      --bg-deep: #0a0612;
      --bg-primary: #0d0a1a;
      --bg-elevated: #141028;
      --bg-glass: rgba(20, 16, 40, 0.72);

      --purple-core: #7c3aed;
      --purple-glow: #a855f7;
      --purple-soft: #c4b5fd;
      --purple-deep: #4c1d95;

      --gold-accent: #e8c17a;
      --emerald-ok: #34d399;
      --rose-alert: #fb7185;

      --text-primary: #f5f3ff;
      --text-secondary: #b8b0d4;
      --text-muted: #6e6690;

      --border-subtle: rgba(168, 85, 247, 0.12);
      --border-bright: rgba(168, 85, 247, 0.35);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --shadow-soft: 0 4px 24px rgba(124, 58, 237, 0.08);
      --shadow-glow: 0 0 40px rgba(124, 58, 237, 0.25);
      --shadow-deep: 0 20px 60px rgba(76, 29, 149, 0.35);

      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 180ms;
      --dur-normal: 320ms;
      --dur-slow: 600ms;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .font-display { font-family: 'Tajawal', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.25); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.5); }

    /* Ambient animated mesh wave */
    .ambient-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 12% 18%, rgba(124, 58, 237, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, rgba(168, 85, 247, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.18) 0%, transparent 60%);
      filter: blur(65px);
      animation: meshWave 16s ease-in-out infinite alternate;
    }

    @keyframes meshWave {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-15px, 20px); }
      100% { transform: scale(1.02) translate(20px, -15px); }
    }

    /* Grain texture overlay (3% opacity) */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Orb breathing animation */
    @keyframes orbBreathing {
      0%, 100% {
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), 0 0 30px rgba(124, 58, 237, 0.2);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.8), 0 0 50px rgba(124, 58, 237, 0.5);
        transform: scale(1.08);
      }
    }
    .moro-orb { animation: orbBreathing 3.6s ease-in-out infinite; }

    /* Glass Panels */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body class="flex flex-col select-none">
  <div class="ambient-mesh"></div>
  <div class="grain-overlay"></div>

  <!-- TOPBAR -->
  <header class="h-14 border-b border-[var(--border-subtle)] bg-[var(--bg-glass)] backdrop-blur-xl px-4 flex items-center justify-between z-30 shrink-0 relative">
    <div class="flex items-center gap-3">
      <button id="btnToggleDrawer" class="w-9 h-9 rounded-lg flex items-center justify-center text-[var(--text-secondary)] hover:text-white hover:bg-white/5 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>

      <div class="flex items-center gap-2.5">
        <div class="relative flex items-center justify-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-[var(--purple-core)] to-[var(--purple-glow)] moro-orb"></div>
          <div class="absolute w-1.5 h-1.5 rounded-full bg-white/80"></div>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-xl font-bold font-display bg-gradient-to-r from-white via-[var(--purple-soft)] to-[var(--gold-accent)] bg-clip-text text-transparent">MOROAI</span>
          <span class="hidden sm:inline-block text-xs font-mono text-[var(--purple-soft)]/70 uppercase">STUDIO OS</span>
        </div>
      </div>
    </div>

    <!-- Omni-Search -->
    <div class="flex-1 max-w-lg mx-4">
      <button id="btnOpenSearch" class="w-full h-9 px-3.5 rounded-lg bg-[var(--bg-elevated)]/80 hover:bg-[var(--bg-elevated)] border border-[var(--border-subtle)] hover:border-[var(--border-bright)] text-sm text-[var(--text-muted)] flex items-center justify-between transition-all">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-[var(--purple-glow)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span id="searchPlaceholder" class="truncate">ابحث في MOROAI أو اسأل أي شيء... (اضغط /)</span>
        </div>
        <kbd class="hidden sm:inline px-2 py-0.5 text-[10px] font-mono bg-white/10 rounded text-[var(--text-secondary)]">/</kbd>
      </button>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="openCustomInstructions()" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-[var(--purple-core)]/20 hover:bg-[var(--purple-core)]/30 border border-[var(--purple-glow)]/40 text-[var(--gold-accent)]" title="التعليمات المخصصة">
        ⚡ التعليمات المخصصة
      </button>
      <button id="btnSessionToggle" class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--purple-core)]/15 text-[var(--purple-soft)] border border-[var(--purple-core)]/30">
        🔗 <span id="sessionStatusText">ذاكرة متصلة</span>
      </button>
      <button id="btnSelfModify" class="w-8 h-8 rounded-lg flex items-center justify-center text-[var(--text-secondary)] hover:text-[var(--gold-accent)] hover:bg-white/5" title="تعديل الواجهة حياً">
        ⚙️
      </button>
      <button id="btnLangToggle" class="px-2 py-1 rounded-lg text-xs font-mono font-medium text-[var(--text-secondary)] hover:text-white border border-white/10">
        EN
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT SPLIT -->
  <main class="flex-1 flex overflow-hidden relative z-10">
    <!-- CHAT (55%) -->
    <section class="flex-1 flex flex-col min-w-0" style="flex-basis: 55%;">
      <div id="chatMessages" class="flex-1 overflow-y-auto px-5 py-6 space-y-5 select-text">
        <!-- Initial Message -->
        <div class="flex flex-col items-start">
          <div class="flex items-center gap-2 mb-1 px-1 text-[11px] text-[var(--purple-soft)]">
            <span class="font-semibold">MOROAI Quantum Studio</span>
            <span>10:42 م</span>
          </div>
          <div class="glass-card max-w-[85%] rounded-[var(--radius-lg)] p-4 text-[15px] leading-relaxed rounded-tl-sm text-[var(--text-primary)]">
            أهلاً بك في MOROAI Studio. جاهز لقراءة وتحليل رواياتك، بناء نماذج 3D التفاعلية، وتطوير الأنظمة المعقدة في بيئة Termux الخفية عبر محادثة واحدة فاخرة.
            <div class="mt-3 flex gap-2">
              <button onclick="switchPreviewState('CHARACTER_BUILDER')" class="px-3 py-1 rounded-full text-xs font-medium border border-[var(--border-bright)] bg-[var(--purple-core)]/20 text-[var(--purple-soft)] hover:text-white">
                تجسيد شخصية طارق البدوي
              </button>
              <button onclick="switchPreviewState('3D_VIEWER')" class="px-3 py-1 rounded-full text-xs font-medium border border-[var(--border-bright)] bg-[var(--purple-core)]/20 text-[var(--purple-soft)] hover:text-white">
                معاينة البلورة 3D
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- COMPOSER -->
      <div class="p-3 bg-[var(--bg-primary)]/90 border-t border-[var(--border-subtle)]">
        <div class="max-w-4xl mx-auto rounded-[var(--radius-xl)] bg-[var(--bg-glass)] border border-[var(--border-subtle)] focus-within:border-[var(--purple-glow)] p-2 sm:p-3 flex items-end gap-2">
          <button id="btnVoiceRecord" class="w-9 h-9 rounded-xl flex items-center justify-center text-[var(--text-secondary)] hover:text-white hover:bg-white/10 shrink-0" title="المحادثة الصوتية بلهجات عربية">
            🎤
          </button>
          <textarea id="composerInput" rows="1" placeholder="اكتب رسالتك، حلل رواية، صمم لعبة 3D... أو اكتب / للأوامر" class="flex-1 bg-transparent border-0 text-sm text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none resize-none py-2 px-1 max-h-36 min-h-[38px]"></textarea>
          <button id="btnSendMessage" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[var(--purple-core)] to-[var(--purple-glow)] text-white flex items-center justify-center shrink-0 shadow-lg">
            ➤
          </button>
        </div>
      </div>
    </section>

    <!-- PREVIEW WORKSHOP (45%) -->
    <section class="flex flex-col min-w-0 border-r border-[var(--border-subtle)] bg-[var(--bg-primary)]" style="flex-basis: 45%;">
      <!-- Workshop Navbar -->
      <div class="h-12 border-b border-[var(--border-subtle)] px-4 flex items-center gap-2 overflow-x-auto bg-[var(--bg-elevated)]/60">
        <span class="text-xs font-bold text-[var(--gold-accent)] shrink-0">الورشة التفاعلية:</span>
        <button onclick="switchPreviewState('CHARACTER_BUILDER')" class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--purple-core)] text-white">الشخصية</button>
        <button onclick="switchPreviewState('3D_VIEWER')" class="px-2.5 py-1 rounded-md text-xs font-medium text-[var(--text-secondary)] hover:text-white">العارض 3D</button>
        <button onclick="switchPreviewState('IMAGE_SELECTION')" class="px-2.5 py-1 rounded-md text-xs font-medium text-[var(--text-secondary)] hover:text-white">الصور 8K</button>
        <button onclick="switchPreviewState('CODE_PREVIEW')" class="px-2.5 py-1 rounded-md text-xs font-medium text-[var(--text-secondary)] hover:text-white">الشفرة</button>
      </div>

      <!-- Workshop Container -->
      <div id="workshopContainer" class="flex-1 p-5 overflow-y-auto">
        <!-- Rendered by JavaScript dynamically -->
      </div>
    </section>
  </main>

  <script>
    // ==========================================================================
    // 2. CONFIGURATION BLOCK & API ENDPOINTS
    // ==========================================================================
    const MORO_CONFIG = {
      appName: 'MOROAI',
      version: '2.4.0-Pro',
      engine: 'Autonomous Core / Termux Invisible Worker',
      theme: {
        bgDeep: '#0a0612',
        purpleCore: '#7c3aed',
        goldAccent: '#e8c17a',
      },
    };

    /**
     * API ENDPOINTS SPECIFICATION:
     * 1. POST /api/moro/chat - Full conversation stream with artifact dispatch
     * 2. POST /api/moro/voice/transcribe - Multilingual/dialect audio transcription
     * 3. POST /api/moro/preview/3d/render - Kinetic procedural 3D model delivery
     * 4. GET /api/moro/agents - Active background autonomous workers
     * 5. POST /api/moro/skills/decision - Ingesting new capabilities into core memory
     */

    let currentLang = 'ar';
    let currentPreviewState = 'CHARACTER_BUILDER';
    let isWorking = false;

    // Workshop Renderer
    function switchPreviewState(newState) {
      currentPreviewState = newState;
      const container = document.getElementById('workshopContainer');

      if (newState === '3D_VIEWER') {
        container.innerHTML = `
          <div class="space-y-4">
            <h3 class="text-base font-bold text-white font-display">العارض التفاعلي ثلاثي الأبعاد (Three.js WebGL)</h3>
            <div class="w-full h-72 rounded-2xl bg-black/80 border border-[var(--border-bright)] relative flex items-center justify-center overflow-hidden">
              <canvas id="threeCanvas" width="480" height="280" class="w-full h-full block cursor-grab"></canvas>
            </div>
            <div class="p-3 rounded-xl bg-[var(--bg-elevated)] border border-[var(--border-subtle)] text-xs text-[var(--text-secondary)]">
              تحكم بالدوران والمحاكاة الآنية لمضلعات النموذج المعتمد.
            </div>
          </div>
        `;
        init3DCanvas();
      } else if (newState === 'CHARACTER_BUILDER') {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[11px] font-mono text-[var(--gold-accent)]">تجسيد الرواية إلى لعبة 3D</span>
                <h3 class="text-xl font-bold text-white font-display">طارق البدوي</h3>
                <p class="text-xs text-[var(--purple-soft)]">الملاح السيبراني للصحراء</p>
              </div>
              <span class="px-2 py-1 rounded bg-[var(--emerald-ok)]/20 text-[var(--emerald-ok)] text-xs font-mono">جاهز للمحرك</span>
            </div>
            <div class="p-4 rounded-xl bg-[var(--purple-core)]/10 border border-[var(--purple-glow)]/20 italic text-sm text-[var(--text-primary)]">
              «الرمال لا تحفظ أسرار من يعبرها بقلب مضطرب؛ وكذلك شفرات النجوم.»
            </div>
            <div class="space-y-2">
              <div class="text-xs font-semibold text-[var(--text-muted)]">السمات المستخرجة من النص:</div>
              <div class="flex flex-wrap gap-1.5">
                <span class="px-2.5 py-1 rounded-md text-xs bg-[var(--bg-elevated)] border border-[var(--border-subtle)] text-[var(--text-secondary)]">كوفية بألياف ضوئية بنفسجية</span>
                <span class="px-2.5 py-1 rounded-md text-xs bg-[var(--bg-elevated)] border border-[var(--border-subtle)] text-[var(--text-secondary)]">عين إلكترونية برونزية</span>
                <span class="px-2.5 py-1 rounded-md text-xs bg-[var(--bg-elevated)] border border-[var(--border-subtle)] text-[var(--text-secondary)]">خبير تيارات الرمال</span>
              </div>
            </div>
            <button onclick="switchPreviewState('3D_VIEWER')" class="w-full py-2.5 rounded-xl bg-[var(--purple-core)] hover:bg-[var(--purple-glow)] text-white text-xs font-bold shadow-lg transition-all">
              تجسيم ثلاثي الأبعاد تفاعلي (3D)
            </button>
          </div>
        `;
      } else {
        container.innerHTML = `<div class="p-6 text-center text-xs text-[var(--text-muted)]">الورشة التفاعلية نشطة · اختر وضع المعاينة المطلوب</div>`;
      }
    }

    // 3D Kinetic Canvas Simulation
    function init3DCanvas() {
      const canvas = document.getElementById('threeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.save();
        ctx.translate(cx, cy);
        angle += 0.02;

        // Rotating Rings
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, 90, 30, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#e8c17a';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Crystal Core
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(124, 58, 237, 0.4)';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();

        ctx.restore();
        if (currentPreviewState === '3D_VIEWER') {
          requestAnimationFrame(draw);
        }
      }
      draw();
    }

    // Chat Send Simulation
    document.getElementById('btnSendMessage').addEventListener('click', () => {
      const input = document.getElementById('composerInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chatMessages');
      // User message
      chat.innerHTML += `
        <div class="flex flex-col items-end">
          <div class="text-[11px] text-[var(--text-muted)] mb-1">أنت · الآن</div>
          <div class="bg-gradient-to-br from-[var(--purple-core)]/30 to-[var(--purple-deep)]/40 border border-[var(--purple-glow)]/20 text-white rounded-[var(--radius-lg)] rounded-tr-sm p-4 text-[15px] max-w-[85%]">
            ${text}
          </div>
        </div>
      `;
      input.value = '';

      // AI response
      setTimeout(() => {
        chat.innerHTML += `
          <div class="flex flex-col items-start">
            <div class="text-[11px] text-[var(--purple-soft)] mb-1">MOROAI Autonomous Core</div>
            <div class="glass-card max-w-[85%] rounded-[var(--radius-lg)] p-4 text-[15px] rounded-tl-sm text-[var(--text-primary)]">
              تمت معالجة الطلب في بيئة Termux الخفية، وربط المخرجات بالورشة التفاعلية مباشرة.
            </div>
          </div>
        `;
        chat.scrollTop = chat.scrollHeight;
      }, 900);
    });

    // Open Custom Instructions
    function openCustomInstructions() {
      const user = prompt("التعليمات المخصصة: أدخل سياق المالك أو اضغط موافق للتحميل الافتراضي (المهندس مراد - 3D Game & Novel Architect)", "المهندس مراد الشلي — خبير ألعاب 3D وروايات ملحمية وبيئة Termux الخفية");
      if (user) {
        const chat = document.getElementById('chatMessages');
        chat.innerHTML += `
          <div class="flex flex-col items-start">
            <div class="text-[11px] text-[var(--gold-accent)] mb-1 font-mono">🔄 تم إعادة تحميل وتوليف نظام MOROAI بناءً على التعليمات المخصصة</div>
            <div class="glass-card max-w-[85%] rounded-[var(--radius-lg)] p-4 text-[15px] rounded-tl-sm text-[var(--text-primary)] border border-[var(--gold-accent)]/40">
              • سياق المالك المعتمد: ${user}<br>
              • بيئة Termux الخفية: نشطة ومحمية ✅<br>
              • محرك الألعاب 3D: جاهز للتصيير والتوليد التفاعلي ✅
            </div>
          </div>
        `;
        chat.scrollTop = chat.scrollHeight;
        switchPreviewState('3D_VIEWER');
      }
    }

    // Initialize Default State
    switchPreviewState('CHARACTER_BUILDER');
  </script>
</body>
</html>
